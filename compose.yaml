services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: swm
      POSTGRES_DB: swm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swm -d swm"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://swm:${POSTGRES_PASSWORD}@db:5432/swm
      APP_ENV: ${APP_ENV:-development}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
    volumes:
      - evidence_data:/app/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  evidence_data:
